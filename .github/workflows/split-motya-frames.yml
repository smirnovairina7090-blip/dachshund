name: Split Motya frames

on:
  push:
    branches: [cozy-room-v1]
    paths:
      - '.github/workflows/split-motya-frames.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cozy-room-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Split sheet into standalone frames
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          candidates=[
              Path('assets/motya/motya-spritesheet.webp'),
              Path('assets/motya-sheet.webp'),
          ]
          source=next((p for p in candidates if p.exists()),None)
          if source is None:
              raise SystemExit('No Motya sprite sheet found')

          src=Image.open(source).convert('RGBA')
          w,h=src.size
          if w % 3 or h % 3:
              raise SystemExit(f'Motya sheet must be a 3x3 grid, got {src.size}')
          fw,fh=w//3,h//3

          out=Path('assets/motya')
          out.mkdir(parents=True,exist_ok=True)
          grid=[['idle','sit','sleep'],['sad','play','walk1'],['walk2','walk3','walk4']]
          for r,row in enumerate(grid):
              for c,name in enumerate(row):
                  frame=src.crop((c*fw,r*fh,(c+1)*fw,(r+1)*fh))
                  frame.save(out/f'{name}.webp','WEBP',lossless=True,method=6)
          print('source',source,'size',src.size,'frame',fw,fh)
          PY
      - name: Commit standalone frames
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/motya/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Split Motya animation into standalone frames"
          git push origin HEAD:cozy-room-v1
