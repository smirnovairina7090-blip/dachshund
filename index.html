<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#7c4d2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Дом Моти</title>
  <link rel="preload" href="assets/room.webp" as="image" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app" aria-label="Интерактивная комната">
    <div id="stage" class="stage">
      <div id="scene" class="scene" aria-hidden="true">
        <img class="room-background" src="assets/room.webp" alt="" draggable="false" />
        <div class="sunbeam sunbeam-a"></div>
        <div class="sunbeam sunbeam-b"></div>
        <div id="objects" class="objects"></div>
        <div class="dust" id="dust"></div>
      </div>
      <div class="vignette"></div>
      <div class="top-glow"></div>
      <header class="hud">
        <div class="home-pill">
          <span class="home-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7v9.1a1.2 1.2 0 0 1-1.2 1.2H15v-6H9v6H4.2A1.2 1.2 0 0 1 3 19.8z"/></svg></span>
          <div><b>Дом Моти</b><small id="modeLabel">Свайпай комнату</small></div>
        </div>
        <button id="resetBtn" class="glass-btn" type="button" aria-label="Вернуть мебель на места"><svg viewBox="0 0 24 24"><path d="M4.8 7.7A8 8 0 1 1 4 15h2.2a5.8 5.8 0 1 0 .2-5.5L9.6 12H3V5.4z"/></svg></button>
      </header>
      <div id="selectionCard" class="selection-card" hidden><span id="selectionName">Предмет</span><small>Тяни пальцем, чтобы переставить</small></div>
      <div id="hint" class="gesture-hint"><span class="hint-hand">☝</span><span>Проведи по комнате • мебель можно двигать</span></div>
      <nav class="dock" aria-label="Действия комнаты">
        <button class="dock-btn is-active" data-action="home" type="button"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7v8a1 1 0 0 1-1 1h-5v-5h-5v5h-5a1 1 0 0 1-1-1z"/></svg><span>Дом</span></button>
        <button id="arrangeBtn" class="dock-btn" data-action="arrange" type="button"><svg viewBox="0 0 24 24"><path d="M9 3h6v2H9zM9 19h6v2H9zM3 9h2v6H3zM19 9h2v6h-2zM8 8h8v8H8z"/></svg><span>Расставить</span></button>
        <button id="centerBtn" class="dock-btn" data-action="center" type="button"><svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 0 7 7h-2.2a4.8 4.8 0 1 1-1.4-3.4L12 12h7V5l-2.1 2.1A6.9 6.9 0 0 0 12 5z"/></svg><span>К окну</span></button>
      </nav>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
