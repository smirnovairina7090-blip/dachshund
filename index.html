<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7d4f2a"><title>Уютная комната</title><link rel="preload" href="assets/room.webp" as="image"><link rel="stylesheet" href="styles.css"></head><body><main class="app"><div id="stage" class="stage view-mode"><div id="scene" class="scene"><img class="room" src="assets/room.webp" alt=""><div class="sun sun-a"></div><div class="sun sun-b"></div><div id="floorGuide" class="floor-guide"><span>Зона пола</span></div><div id="objects" class="objects"></div><div id="dust" class="dust"></div></div><div class="vignette"></div><span id="mode" class="sr-only" aria-live="polite">Смотреть · свайп + 2 пальца = масштаб</span><button id="reset" class="reset-float" aria-label="Сбросить расстановку"><span>↺</span></button><div id="hint" class="hint">Свайпай комнату или уменьши её двумя пальцами</div><div id="variantBackdrop" class="variant-backdrop"></div><section id="variantPanel" class="variant-panel" aria-hidden="true"><div class="variant-handle"></div><div class="variant-head"><div><small>Варианты предмета</small><b id="variantTitle">Выбери вариант</b></div><button id="variantClose" class="variant-close" type="button" aria-label="Закрыть">×</button></div><div id="variantOptions" class="variant-options"></div></section><nav class="dock" aria-label="Управление комнатой"><button id="viewMode" class="dock-btn active" aria-label="Смотреть комнату"><span class="dock-art room-art"><img src="assets/room.webp" alt=""></span><span class="dock-label">Смотреть</span></button><button id="arrange" class="dock-btn" aria-label="Перестановка мебели"><span class="dock-art furniture-art"><img src="assets/armchair.webp" alt=""></span><span class="dock-label">Перестановка</span></button><button id="windowBtn" class="dock-btn" aria-label="Перейти к окну"><span class="dock-art window-art"><img src="assets/room.webp
